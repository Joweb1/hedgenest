openapi: 3.0.0
info:
  title: Documentation for HedgeNest Waitlist
  version: 1.0.0
  description: HedgeNest waitlist registration endpoint
paths:
  /api/v1/waitlist:
    post:
      summary: Register for the waitlist
      tags: [waitlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - amountRange
              properties:
                firstName:
                  type: string
                  example: Adaeze
                lastName:
                  type: string
                  example: Agnes
                email:
                  type: string
                  example: adaeze@gmail.com
                amountRange:
                  type: string
                  example: 5000-100000-annually
      responses:
        "201":
          description: Successfully joined the waitlist and verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Successfully joined the waitlist. We have sent a verification email to secure your spot.
                  data:
                    type: object
                    properties:
                      firstName:
                        type: string
                        example: Adaeze
                      email:
                        type: string
                        example: adaeze@gmail.com
                      signupBonus:
                        type: number
                        example: 5000
                      referralCode:
                        type: string
                        example: HN-8F2A1C
                      referralLink:
                        type: string
                        example: https://hedge-nest.vercel.app/waitlist?ref=HN-8F2A1C
                      verifyUrl:
                        type: string
                        example: http://localhost:3333/api/v1/waitlist/verify?token=5b4776d1e4b46277...
                      referralReward:
                        type: number
                        example: 2000
                      isVerified:
                        type: boolean
                        example: false
                      verificationToken:
                        type: string
                        example: 5b4776d1e4b4627708cee40f6a0756fceaff83617cbaada242273717391563b5
        "400":
          description: Validation error or duplicate email

  /api/v1/waitlist/verify:
    get:
      summary: Verify waitlist email & view celebration landing page
      description: When clicked from the verification email, this endpoint marks the user as verified, calculates their waitlist ranking, dispatches the spot secured congratulations email, and renders an interactive HTML landing page featuring confetti/graffiti animations and viral share buttons.
      tags: [waitlist]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: Verification token received in email
        - in: query
          name: email
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Email verified successfully. Returns the celebration HTML landing page (or JSON if requested by API client).
          content:
            text/html:
              schema:
                type: string
                description: Responsive HTML page with confetti/graffiti animation and waitlist ranking
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Email verified successfully! Your waitlist spot is secured.
        "400":
          description: Invalid or expired verification token


    post:
      summary: Verify waitlist email via API
      tags: [waitlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: 3c9b1f5e88d672...
                email:
                  type: string
                  example: adaeze@gmail.com
      responses:
        "200":
          description: Email verified successfully and spot confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Email verified successfully! Your waitlist spot is secured.
                  data:
                    type: object
                    properties:
                      firstName:
                        type: string
                        example: Adaeze
                      email:
                        type: string
                        example: adaeze@gmail.com
                      waitlistPosition:
                        type: number
                        example: 42
                      signupBonus:
                        type: number
                        example: 5000
                      referralCode:
                        type: string
                        example: HN-8F2A1C
                      referralLink:
                        type: string
                        example: https://hedge-nest.vercel.app/waitlist?ref=HN-8F2A1C
                      referralReward:
                        type: number
                        example: 2000
                      isVerified:
                        type: boolean
                        example: true
        "400":
          description: Invalid or expired token

  /api/v1/waitlist/resend-verification:
    post:
      summary: Resend verification email
      tags: [waitlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: adaeze@gmail.com
      responses:
        "200":
          description: Verification email resent successfully
        "404":
          description: Email not found on waitlist


