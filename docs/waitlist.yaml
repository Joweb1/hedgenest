openapi: 3.0.0
info:
  title: Documentation for HedgeNest Waitlist
  version: 1.0.0
  description: HedgeNest waitlist registration endpoint
paths:
  /api/waitlist:
    post:
      summary: Register for the waitlist
      tags: [waitlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - amountRange
              properties:
                firstName:
                  type: string
                  example: Adaeze
                lastName:
                  type: string
                  example: Agnes
                email:
                  type: string
                  example: adaeze@gmail.com
                amountRange:
                  type: string
                  example: 5000-100000-annually
      responses:
        "201":
          description: Successfully joined the waitlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Successfully joined the waitlist.
                  data:
                    type: object
                    properties:
                      firstName:
                        type: string
                        example: Adaeze
                      email:
                        type: string
                        example: adaeze@gmail.com
                      signupBonus:
                        type: number
                        example: 5000
                      referralCode:
                        type: string
                        example: HN-8F2A1C
                      referralLink:
                        type: string
                        example: https://hedge-nest.vercel.app/waitlist?ref=HN-8F2A1C
                      referralReward:
                        type: number
                        example: 2000
        "400":
          description: Validation error or duplicate email
