openapi: 3.0.0
info: 
  title: Documentation for HedgeNest Admin
  version: 1.0.0
  description: HedgeNest for admin management
paths:
  /api/v1/create-admin:
    post:
      summary: this end point is to create an admin
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - phoneNumber
                - email
                - password
              properties:
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                phoneNumber:
                  type: string
                  example: 09183748577
                email:
                  type: string
                  example: johndoe@gmail.com
                password:
                  type: string
                  example: Password123
      responses:
        "201":
          description: Admin created successfully, otp has been sent to email
        "400":
          description: Admin with this email already exist

  /api/v1/login-admin:
    post:
      summary: this end point is to login an admin
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
                password:
                  type: string
                  example: Password123
      responses:
        "200":
          description: Login Successful
        "400":
          description: Email and password are required or Invalid Credentials or Please verify your email
        "404":
          description: Invalid Credentials

  /api/v1/verify-admin:
    post:
      summary: this end point is to verify admin email with otp
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
                otp:
                  type: string
                  example: 482910
      responses:
        "200":
          description: OTP Verified successfully
        "400":
          description: OTP Expired or Invalid OTP credentials
        "404":
          description: Admin not found

  /api/v1/forgot-admin-password:
    post:
      summary: this end point is to send otp to admin email for password reset
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
      responses:
        "200":
          description: OTP sent to email
        "400":
          description: Email is required or Admin not found

  /api/v1/reset-admin-password:
    post:
      summary: this end point is to reset admin password using otp
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - newPassword
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
                otp:
                  type: string
                  example: 482910
                newPassword:
                  type: string
                  example: NewPassword123
      responses:
        "200":
          description: Password reset successfully
        "400":
          description: Email, OTP and New password are required or OTP Expired or Invalid OTP credentials
        "404":
          description: Admin not found

  /api/v1/change-admin-password:
    post:
      summary: this end point is to change admin password (requires authentication)
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: Password123
                newPassword:
                  type: string
                  example: NewPassword456
      responses:
        "200":
          description: Password changed successfully
        "400":
          description: Old password and new password are required or Incorrect Password
        "404":
          description: Admin not found

  /api/v1/get-One/{id}:
    get:
      summary: this end point is to get one user
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: "64abc123def456"
      responses:
        "200":
          description: User Found
        "400":
          description: something went wrong

  /api/v1/get-all-users:
    get:
      summary: this end point is to get all users
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All Users Found
        "400":
          description: something went wrong

  /api/v1/get-all-payments:
    get:
      summary: this end point is to get all payments
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All Payments Found
        "400":
          description: something went wrong

  /api/v1/get-all-transactions:
    get:
      summary: this end point is to get all transactions
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All Transactions Found
        "400":
          description: something went wrong

  /api/v1/get-all-revenue:
    get:
      summary: this end point is to get all revenue
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All Revenue Found
        "400":
          description: something went wrong

  /api/v1/get-all-conversion:
    get:
      summary: this end point is to retrieve all conversion
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All Conversion Found
        "400":
          description: something went wrong

  /api/v1/get-all-waitlist:
    get:
      summary: Retrieve all registered waitlist users from the database
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [verified, pending, active, approved]
          description: Filter waitlist entries by verification status
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search by name, email, or referral code
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Waitlist entries retrieved successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin access required
        "500":
          description: Server error